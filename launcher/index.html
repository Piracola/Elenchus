<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elenchus Launcher</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="launcher-shell">
      <header class="launcher-header">
        <img class="brand-icon" src="./assets/elenchus-64.png" alt="" />
        <div class="brand-copy">
          <h1>Elenchus</h1>
          <p>AI 多智能体辩论平台</p>
        </div>
      </header>

      <section class="status-panel" aria-live="polite">
        <div class="status-row">
          <span id="status-dot" class="status-dot status-dot--idle"></span>
          <div class="status-copy">
            <span id="status-title" class="status-title">未启动</span>
            <span id="status-detail" class="status-detail">点击启动后会拉起本地服务。</span>
          </div>
        </div>
        <div class="service-url">
          <span>访问地址</span>
          <strong id="service-url">http://127.0.0.1:8001</strong>
        </div>
      </section>

      <section class="extension-area">
        <span class="extension-label">扩展区</span>
        <p id="extension-message">后续可在这里加入日志、配置入口和更新状态。</p>
      </section>

      <footer class="actions">
        <button id="start-button" type="button" class="button button-primary">启动</button>
        <button id="exit-button" type="button" class="button button-secondary">退出</button>
      </footer>
    </main>

    <script type="module" src="./main.js"></script>
  </body>
</html>
