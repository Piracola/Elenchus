name: Build Portable EXE Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "要发布的版本号或标签，例如 v2.0.1"
        required: true
      release_title:
        description: "发行版标题；留空时自动使用 Elenchus <版本号>"
        required: false
        default: ""
      release_notes:
        description: "发行说明（Markdown）；留空时自动生成"
        required: false
        default: ""
      include_runtime_config:
        description: "是否把指定的 runtime config 文件打进发布包"
        required: false
        type: boolean
        default: false
      runtime_config_path:
        description: "启用运行时配置打包时，要打包的仓库内文件路径"
        required: false
        default: ""
      allow_live_runtime_config:
        description: "是否确认直接打包仓库里的 live runtime/config.json"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "是否标记为预发布版本"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  frontend-quality:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm run test:run

  backend-tests:
    name: Backend pytest gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        run: uv sync --frozen --group dev

      - name: Run backend tests
        run: uv run --frozen --group dev pytest tests

  build:
    name: Build Windows Portable EXE
    needs:
      - frontend-quality
      - backend-tests
    runs-on: windows-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release_title: ${{ steps.meta.outputs.release_title }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      artifact: ${{ steps.meta.outputs.artifact }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
            release_title="Elenchus ${version}"
            prerelease="false"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="${{ github.event.inputs.release_version }}"
            release_title="${{ github.event.inputs.release_title }}"
            prerelease="${{ github.event.inputs.prerelease }}"
          else
            version="snapshot-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
            release_title="Elenchus ${version}"
            prerelease="false"
          fi

          if [[ -z "${release_title}" ]]; then
            release_title="Elenchus ${version}"
          fi

          artifact="elenchus-portable-${version}-windows.zip"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "release_title=${release_title}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "artifact=${artifact}" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Install backend build dependencies
        run: uv sync --project backend --frozen --no-default-groups --group build

      - name: Smoke test backend startup
        run: uv run --project backend --frozen --no-default-groups --group build python scripts/smoke_test_release_backend.py

      - name: Build portable EXE release
        shell: pwsh
        env:
          INCLUDE_RUNTIME_CONFIG: ${{ github.event.inputs.include_runtime_config || 'false' }}
          RUNTIME_CONFIG_PATH: ${{ github.event.inputs.runtime_config_path || '' }}
          ALLOW_LIVE_RUNTIME_CONFIG: ${{ github.event.inputs.allow_live_runtime_config || 'false' }}
        run: |
          $arguments = @(
            "scripts/build_pyinstaller_release.py",
            "--version",
            "${{ steps.meta.outputs.version }}"
          )

          if ($env:INCLUDE_RUNTIME_CONFIG -eq "true") {
            $arguments += "--include-runtime-config"
          }
          if (-not [string]::IsNullOrWhiteSpace($env:RUNTIME_CONFIG_PATH)) {
            $arguments += "--runtime-config-path"
            $arguments += $env:RUNTIME_CONFIG_PATH
          }
          if ($env:ALLOW_LIVE_RUNTIME_CONFIG -eq "true") {
            $arguments += "--allow-live-runtime-config"
          }

          uv run --project backend --frozen --no-default-groups --group build python @arguments

      - name: Smoke test packaged release artifact
        run: uv run --project backend --frozen --no-default-groups --group build python scripts/smoke_test_release_backend.py --release-archive dist/releases/${{ steps.meta.outputs.artifact }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact }}
          path: |
            dist/releases/${{ steps.meta.outputs.artifact }}
            dist/releases/${{ steps.meta.outputs.artifact }}.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: elenchus-portable-*
          path: dist/releases
          merge-multiple: true

      - name: Write manual release notes
        id: notes
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_notes != ''
        shell: bash
        env:
          RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          notes_path="$RUNNER_TEMP/release-notes.md"
          printf '%s\n' "$RELEASE_NOTES" > "$notes_path"
          echo "notes_path=${notes_path}" >> "$GITHUB_OUTPUT"

      - name: Publish assets to GitHub Release with manual notes
        if: steps.notes.outputs.notes_path != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.release_title }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          body_path: ${{ steps.notes.outputs.notes_path }}
          files: |
            dist/releases/${{ needs.build.outputs.artifact }}
            dist/releases/${{ needs.build.outputs.artifact }}.sha256
          generate_release_notes: false

      - name: Publish assets to GitHub Release with generated notes
        if: steps.notes.outputs.notes_path == ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.release_title }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          files: |
            dist/releases/${{ needs.build.outputs.artifact }}
            dist/releases/${{ needs.build.outputs.artifact }}.sha256
          generate_release_notes: true
