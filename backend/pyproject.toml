[project]
name = "elenchus-backend"
version = "1.0.0"
description = "Elenchus backend runtime and API"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.10.4",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    "aiosqlite==0.20.0",
    "greenlet==3.5.3",
    "langgraph==0.2.60",
    "langchain-core==0.3.63",
    "langchain-openai==0.3.0",
    "langchain-anthropic==0.3.0",
    "langchain-google-genai==2.1.5",
    "openai==1.109.1",
    "httpx==0.28.1",
    "ddgs==9.11.3",
    "markdown-it-py==4.2.0",
    "cryptography==46.0.5",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-asyncio==1.3.0",
    "pytest-cov==7.0.0",
    "ruff==0.15.6",
    "mypy==1.19.1",
]
build = [
    "pyinstaller==6.19.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
